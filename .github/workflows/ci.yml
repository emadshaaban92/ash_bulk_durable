name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  # The library's own suite, on its own resources, across the supported range.
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      # config/test.exs connects to host "db"; point it at the service.
      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

  # Runs the whole system under chaos (test/stress/overlap_stress_test.exs),
  # at a small, fixed size. Locally, set STRESS_SEED, STRESS_BULK_ACTIONS and
  # STRESS_ITERATIONS to run it longer.
  stress:
    name: Stress (overlapping runs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STRESS_SEED: "1"
      STRESS_BULK_ACTIONS: "12"
      STRESS_ITERATIONS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-29-1.20-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-29-1.20-

      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: mix deps.get

      - name: Run the stress test
        run: mix test --only stress --warnings-as-errors

  # AshBulkDurable.Storage.S3 against a real S3 API
  # (test/storage/s3_api_test.exs), so the ETS stub its unit tests use is
  # checked against a store that is not ours: RustFS, a MinIO-compatible
  # server, since MinIO no longer publishes its image on Docker Hub.
  s3:
    name: S3 store (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Started by hand, not as a service, so the job waits until it answers.
      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 9000:9000 rustfs/rustfs:1.0.4
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:9000/ && exit 0
            sleep 1
          done
          docker logs rustfs
          exit 1

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-29-1.20-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-29-1.20-

      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: mix deps.get

      - name: Run the S3 tests
        run: mix test --only s3 --warnings-as-errors

      - name: RustFS logs
        if: failure()
        run: docker logs rustfs

  # Version-independent checks, once.
  quality:
    name: Quality (format · credo · audits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `mix format` output is version-sensitive, so this is the toolchain
      # .tool-versions pins.
      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      # !cancelled() so one run surfaces every failure, not just the first.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: mix format --check-formatted

      - name: Static analysis (Credo)
        if: ${{ !cancelled() }}
        run: mix credo

      - name: Retired package audit (mix hex.audit)
        if: ${{ !cancelled() }}
        run: mix hex.audit

      # The test resources' snapshots and migrations, in priv/test_repo.
      - name: Migrations are up to date
        if: ${{ !cancelled() }}
        run: mix check.migrations

  # The screens, on a real router and endpoint, using the library as an app does.
  example-test:
    name: Test (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-

      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install example dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Static analysis (Credo)
        run: mix credo

      # What the running app holds; the test fixtures' tables are `priv/test_repo`'s.
      - name: Migrations are up to date
        run: mix ash_postgres.generate_migrations --check
        env:
          MIX_ENV: dev

      - name: Run tests
        run: mix test --warnings-as-errors
